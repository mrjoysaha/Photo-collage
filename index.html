<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy-First Photo Collage Maker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
    }

    main {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      padding: 1.5rem;
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .controls-panel {
      flex: 1;
      min-width: 320px;
      background: var(--card);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .canvas-panel {
      flex: 2;
      min-width: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      border-radius: 12px;
      border: 1px dashed var(--border);
      padding: 1.5rem;
      overflow: hidden;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .file-dropzone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .file-dropzone:hover {
      border-color: var(--accent);
      background-color: rgba(56, 189, 248, 0.05);
    }

    .file-dropzone input {
      display: none;
    }

    .grid-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
    }

    .grid-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .grid-btn:hover {
      border-color: var(--accent);
    }

    .grid-btn.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }

    .layout-icon {
      width: 32px;
      height: 32px;
      border: 1.5px solid currentColor;
      border-radius: 4px;
      display: flex;
      gap: 2px;
      padding: 2px;
    }

    .layout-icon .cell {
      background: currentColor;
      opacity: 0.7;
      border-radius: 1px;
    }

    /* Layout icon representations */
    .icon-side-by-side {
      flex-direction: row;
    }
    .icon-side-by-side .cell {
      flex: 1;
      height: 100%;
    }

    .icon-top-bottom {
      flex-direction: column;
    }
    .icon-top-bottom .cell {
      flex: 1;
      width: 100%;
    }

    .icon-grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .icon-grid-3x3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 2px solid var(--border);
      border-radius: 50%;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .btn-download {
      background: var(--accent);
      color: #0f172a;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: auto;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-download:hover {
      background: var(--accent-hover);
    }

    canvas {
      max-width: 100%;
      max-height: 65vh;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .preview-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
      max-height: 120px;
      overflow-y: auto;
    }

    .preview-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 style="font-size: 1.25rem;">OffGrid Collage</h1>
      <p style="font-size: 0.8rem; color: var(--text-muted);">Client-Side Only Photo Assembler</p>
    </div>
    <span class="badge">100% Offline / Zero Uploads</span>
  </header>

  <main>
    <section class="controls-panel">
      <!-- File Selector -->
      <div class="form-group">
        <label>1. Select Photos</label>
        <label class="file-dropzone" for="imageInput">
          <span>Drop photos here or click to browse</span>
          <input type="file" id="imageInput" accept="image/*" multiple>
        </label>
        <div id="previewList" class="preview-list"></div>
      </div>

      <!-- Layout Selection -->
      <div class="form-group">
        <label>2. Collage Layout</label>
        <div class="grid-options" id="layoutSelector">
          <!-- Side-by-Side (2 cols x 1 row) -->
          <button class="grid-btn active" data-cols="2" data-rows="1">
            <div class="layout-icon icon-side-by-side">
              <div class="cell"></div>
              <div class="cell"></div>
            </div>
            Side-by-Side
          </button>

          <!-- Top-Bottom (1 col x 2 rows) -->
          <button class="grid-btn" data-cols="1" data-rows="2">
            <div class="layout-icon icon-top-bottom">
              <div class="cell"></div>
              <div class="cell"></div>
            </div>
            Top-Bottom
          </button>

          <!-- 2x2 Grid -->
          <button class="grid-btn" data-cols="2" data-rows="2">
            <div class="layout-icon icon-grid-2x2">
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
            </div>
            2 x 2 Grid
          </button>

          <!-- 3x3 Grid -->
          <button class="grid-btn" data-cols="3" data-rows="3">
            <div class="layout-icon icon-grid-3x3">
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
            </div>
            3 x 3 Grid
          </button>
        </div>
      </div>

      <!-- Spacing -->
      <div class="form-group">
        <label for="spacing">Gap / Border Width (<span id="spacingVal">12</span>px)</label>
        <input type="range" id="spacing" min="0" max="60" value="12">
      </div>

      <!-- Background color -->
      <div class="form-group">
        <label for="bgColor">Background / Border Color</label>
        <div class="color-row">
          <input type="color" id="bgColor" value="#ffffff">
          <span id="colorHex" style="font-size: 0.85rem; font-family: monospace;">#ffffff</span>
        </div>
      </div>

      <button id="downloadBtn" class="btn-download">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        Download Collage
      </button>
    </section>

    <!-- Canvas Preview Area -->
    <section class="canvas-panel">
      <canvas id="collageCanvas" width="1600" height="1200"></canvas>
    </section>
  </main>

  <script>
    const state = {
      images: [],
      cols: 2,
      rows: 1,
      spacing: 12,
      bgColor: '#ffffff'
    };

    const fileInput = document.getElementById('imageInput');
    const canvas = document.getElementById('collageCanvas');
    const ctx = canvas.getContext('2d');
    const spacingInput = document.getElementById('spacing');
    const spacingVal = document.getElementById('spacingVal');
    const bgColorInput = document.getElementById('bgColor');
    const colorHex = document.getElementById('colorHex');
    const layoutBtns = document.querySelectorAll('.grid-btn');
    const previewList = document.getElementById('previewList');
    const downloadBtn = document.getElementById('downloadBtn');

    // Load local files securely with FileReader
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      state.images = [];
      previewList.innerHTML = '';

      let loadedCount = 0;
      files.forEach((file) => {
        if (!file.type.startsWith('image/')) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            state.images.push(img);

            const thumb = document.createElement('img');
            thumb.src = event.target.result;
            thumb.className = 'preview-thumb';
            previewList.appendChild(thumb);

            loadedCount++;
            if (loadedCount === files.length) {
              renderCollage();
            }
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    });

    // Layout buttons event
    layoutBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        layoutBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        state.cols = parseInt(btn.getAttribute('data-cols'), 10);
        state.rows = parseInt(btn.getAttribute('data-rows'), 10);
        renderCollage();
      });
    });

    // Spacing slider
    spacingInput.addEventListener('input', (e) => {
      state.spacing = parseInt(e.target.value, 10);
      spacingVal.textContent = state.spacing;
      renderCollage();
    });

    // Color picker
    bgColorInput.addEventListener('input', (e) => {
      state.bgColor = e.target.value;
      colorHex.textContent = e.target.value;
      renderCollage();
    });

    // Helper: Draw image with "cover" crop ratio into slot
    function drawImageCover(ctx, img, x, y, width, height) {
      const imgRatio = img.width / img.height;
      const targetRatio = width / height;
      let sX = 0, sY = 0, sW = img.width, sH = img.height;

      if (imgRatio > targetRatio) {
        sW = img.height * targetRatio;
        sX = (img.width - sW) / 2;
      } else {
        sH = img.width / targetRatio;
        sY = (img.height - sH) / 2;
      }

      ctx.drawImage(img, sX, sY, sW, sH, x, y, width, height);
    }

    // Render Canvas
    function renderCollage() {
      const cols = state.cols;
      const rows = state.rows;

      // Adjust default canvas dimensions to suit orientation
      if (cols === 2 && rows === 1) {
        // Side-by-side: 4:3 landscape default
        canvas.width = 1600;
        canvas.height = 1000;
      } else if (cols === 1 && rows === 2) {
        // Top-bottom: 3:4 portrait default
        canvas.width = 1000;
        canvas.height = 1600;
      } else {
        // Square grid (2x2, 3x3)
        canvas.width = 1500;
        canvas.height = 1500;
      }

      // Draw background
      ctx.fillStyle = state.bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (state.images.length === 0) {
        ctx.fillStyle = '#64748b';
        ctx.font = '24px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Select photos to preview collage', canvas.width / 2, canvas.height / 2);
        return;
      }

      // Calculate slot boundaries
      const totalGapX = state.spacing * (cols + 1);
      const totalGapY = state.spacing * (rows + 1);
      const cellWidth = (canvas.width - totalGapX) / cols;
      const cellHeight = (canvas.height - totalGapY) / rows;

      let imgIdx = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (imgIdx >= state.images.length) break;

          const x = state.spacing + c * (cellWidth + state.spacing);
          const y = state.spacing + r * (cellHeight + state.spacing);

          drawImageCover(ctx, state.images[imgIdx], x, y, cellWidth, cellHeight);
          imgIdx++;
        }
      }
    }

    // Download generated collage locally
    downloadBtn.addEventListener('click', () => {
      if (state.images.length === 0) {
        alert('Please select some photos first.');
        return;
      }

      const link = document.createElement('a');
      link.download = `collage-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png', 0.95);
      link.click();
    });

    // Initial canvas state
    renderCollage();
  </script>
</body>
</html>
